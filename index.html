  function fDataEstesaBreve(iso) { var g = GIORNI[giornoSett(iso) - 1]; return g.charAt(0).toUpperCase() + g.slice(1) + ' ' + fDataBreve(iso); }
  function nomeMese(m) { return MESI[+m.substring(5, 7) - 1] + ' ' + m.substring(0, 4); }
  function nomeMeseM(m) { var n = nomeMese(m); return n.charAt(0).toUpperCase() + n.slice(1); }
  function aggMesi(mese, n) { var a = +mese.substring(0, 4), m = +mese.substring(5, 7) - 1 + n; a += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return a + '-' + pad(m + 1); }
  function fNum(n, d) { d = d === undefined ? 2 : d; var v = Number(n) || 0; var neg = v < 0; v = Math.abs(v); var s = v.toFixed(d); var p = s.split('.'); return (neg ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (d ? ',' + p[1] : ''); }
  function fEuro(n) { return fNum(n) + ' €'; }
  function fOre(h) { var v = Math.round((Number(h) || 0) * 100) / 100; return String(v).replace('.', ',') + ' h'; }
  function numero(t) { if (typeof t === 'number') return t; var s = String(t || '').trim().replace(/\./g, '').replace(',', '.'); if (/^-?\d+(\.\d+)?$/.test(String(t).trim())) s = String(t).trim(); var n = parseFloat(s); return isNaN(n) ? 0 : n; }
  function oreTra(i, f) { if (!i || !f) return 0; var a = i.split(':'), b = f.split(':'); var mi = +a[0] * 60 + +a[1], mf = +b[0] * 60 + +b[1]; if (mf <= mi) mf += 1440; return Math.round((mf - mi) / 60 * 100) / 100; }

  // ------------------------------------------------------------------ chiamate al server
  var stato = { k: '', boot: null, scheda: 'ore', mese: '', dati: null, buste: null, documenti: null, impostazioni: null, caricandoMese: false };

  function chiama(nome, args) {
    if (window.ADATTATORE) return window.ADATTATORE.chiama(nome, stato.k, args || {});
    return new Promise(function (ris, rif) {
      if (window.API_URL) {
        // interfaccia ospitata fuori da Google: POST "semplice" (text/plain, niente preflight) e redirect seguito
        fetch(window.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ nome: nome, k: stato.k, args: args || {} }), redirect: 'follow' })
          .then(function (r) { return r.json(); }).then(ris, function (e) { rif(new Error('Server non raggiungibile: ' + e.message)); });
      } else if (SVILUPPO) {
        fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: nome, k: stato.k, args: args || {} }) })
          .then(function (r) { return r.json(); }).then(ris, function (e) { rif(new Error('Server non raggiungibile: ' + e.message)); });
      } else {
        google.script.run.withSuccessHandler(ris).withFailureHandler(function (e) { rif(new Error(e && e.message ? e.message : String(e))); }).api(nome, stato.k, args || {});
      }
    });
  }

  /** Esegue una chiamata mostrando lo stato di caricamento sul pulsante; in caso di errore mostra il toast e rilancia. */

        $('#scheda-ore').innerHTML = '';

      }
      stato.boot = r;
      if (!stato.mese) stato.mese = (PARAMETRI && PARAMETRI.mese && /^\d{4}-\d{2}$/.test(PARAMETRI.mese)) ? PARAMETRI.mese : r.mese_corrente;

      } else {

        h.push('<div class="riga" data-azione="modifica-assenza" data-id="' + esc(a.id) + '"><div class="sx"><div class="quando">' + esc(fDataEstesa(a.data)) + '</div><div class="cosa">' + esc(a.etichetta) + (a.causa === 'da_recuperare' ? ' · recuperate ' + esc(fOre(a.ore_recuperate)) + ', restano ' + esc(fOre(a.ore_residue)) : '') + (a.protocollo ? ' · prot. ' + esc(a.protocollo) : '') + (a.note ? ' · ' + esc(a.note) : '') + '</div></div><div class="dx"><span style="color:var(--grigio)">' + esc(fOre(a.ore)) + '</span></div></div>');

    if (d.totali.festivita.length) d.totali.festivita.forEach(function (f) { h.push('<div class="riga statica"><div class="sx"><div class="quando">' + esc(fDataEstesa(f.data)) + '</div><div class="cosa">Festività: ' + esc(f.nome) + ' (retribuita)</div></div><div class="dx"><span style="color:var(--grigio)">' + esc(fOre(c.festivita_ore)) + '</span></div></div>'); });

    else h.push('<p class="nota-piccola">Il mese è «' + esc(d.etichetta_stato) + '»: non si può più modificare.</p>');

    } else if (d.stato === 'in_approvazione') {
      h.push('<p class="sotto">Inviato il ' + esc(fData(d.record.inviato_il)) + ': in attesa dell\'approvazione dei genitori.</p>');

  // ------------------------------------------------------------------ moduli turni / assenze
  function opzioni(lista, valore) { return lista.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === valore ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }

  function campoNotaGenitore(valore) {
    if (!eGenitore()) return '<label>Nota (facoltativa)</label><input type="text" name="nota" value="' + esc(valore || '') + '">';
    return '<label>Nota (obbligatoria per le correzioni dei genitori)</label><input type="text" name="nota" value="' + esc(valore || '') + '" placeholder="es. corretto l\'orario come concordato">';
  }

  function modaleTurno(t, titolo) {
    var c = cp(); t = t || {};
    var tipo = t.tipo || 'spostato';
    var tipi = [['ordinario', 'Ordinario (orario abituale)'], ['spostato', 'Orario spostato (di comune accordo)'], ['aggiuntivo', 'Ore aggiuntive (oltre le ' + c.ore_settimanali + ' h, chieste da un genitore)'], ['recupero', 'Recupero di ore saltate']];
    var daRec = (stato.dati && stato.dati.assenze_da_recuperare) || [];
    var h = '<form id="form-turno">' +
      (t.id ? '<input type="hidden" name="id" value="' + esc(t.id) + '">' : '') +
      '<label>Giorno</label><input type="date" name="data" value="' + esc(t.data || stato.boot.prossimo_giorno.data) + '" required>' +
      '<div class="due"><div><label>Dalle</label><input type="time" name="ora_inizio" step="900" value="' + esc(t.ora_inizio || c.ora_inizio_ordinaria) + '" required></div><div><label>Alle</label><input type="time" name="ora_fine" step="900" value="' + esc(t.ora_fine || c.ora_fine_ordinaria) + '" required></div></div>' +
      '<div class="nota-piccola" id="ore-calcolate"></div>' +
      '<label>Tipo</label><select name="tipo">' + opzioni(tipi, tipo) + '</select>' +
      '<div id="campi-spostato"><label>Al posto del ' + esc(GIORNI[(c.giorno_ordinario || 2) - 1]) + '</label><input type="date" name="data_riferimento" value="' + esc(t.data_riferimento || '') + '"><div class="nota-piccola">Il giorno abituale che questo turno sostituisce (così la settimana risulta coperta).</div></div>' +
      '<div id="campi-recupero"><label>Giornata che stai recuperando</label>' + (daRec.length ? '<select name="assenza_id">' + opzioni(daRec.map(function (a) { return [a.id, fDataEstesa(a.data) + ' – restano ' + fOre(a.ore_residue)]; }), t.assenza_id) + '</select>' : '<div class="avviso">Non ci sono ore da recuperare.</div>') + '<div class="nota-piccola">Le ore di recupero sono pagate nel mese in cui vengono fatte, senza maggiorazioni.</div></div>' +
      '<label>Attività (facoltativa)</label><input type="text" name="attivita" value="' + esc(t.attivita || '') + '" placeholder="es. compiti Enrico, parco">' +
      campoNotaGenitore(t.nota) +
      '<button class="btn btn-primario" data-azione="salva-turno">Salva</button>' +
      (t.id ? '<button class="btn btn-rosso" data-azione="elimina-turno" data-id="' + esc(t.id) + '">Elimina</button>' : '') +
      '</form>';
    apriModale(titolo || (t.id ? 'Modifica turno' : 'Orario diverso'), h);
    if (t.data_riferimento) $('#form-turno [name=data_riferimento]').dataset.manuale = '1';
    aggiornaCampiTurno();
    var f = $('#form-turno');
    f.addEventListener('change', aggiornaCampiTurno);
    f.addEventListener('input', aggiornaCampiTurno);
    f.addEventListener('submit', function (ev) { ev.preventDefault(); });
  }

  function aggiornaCampiTurno(ev) {
    var f = $('#form-turno'); if (!f) return;
    var tipo = f.tipo.value;
    $('#campi-spostato').style.display = tipo === 'spostato' ? '' : 'none';
    $('#campi-recupero').style.display = tipo === 'recupero' ? '' : 'none';
    var ore = oreTra(f.ora_inizio.value, f.ora_fine.value);
    $('#ore-calcolate').textContent = ore ? 'Durata: ' + fOre(ore) + (ore > 12 ? ' (attraversa la mezzanotte?)' : '') : '';
    if (ev && ev.target === f.data_riferimento) f.data_riferimento.dataset.manuale = '1';
    // proposta: il giorno contrattuale della stessa settimana, finché l'utente non lo cambia a mano
    if (tipo === 'spostato' && f.data.value && !f.data_riferimento.dataset.manuale) {
      var g = giornoSett(f.data.value), d = dataDaIso(f.data.value); d.setDate(d.getDate() + ((cp().giorno_ordinario || 2) - g));
      f.data_riferimento.value = isoDaData(d);
    }
  }

  function salvaTurnoDaForm(bottone) {
    var f = $('#form-turno');
    var args = { id: f.id ? f.id.value : '', data: f.data.value, ora_inizio: f.ora_inizio.value, ora_fine: f.ora_fine.value, tipo: f.tipo.value, attivita: f.attivita.value, nota: f.nota.value };
    if (args.tipo === 'spostato') args.data_riferimento = f.data_riferimento.value;
    if (args.tipo === 'recupero') { if (!f.assenza_id) { avvisa('Non ci sono ore da recuperare.', 'errore'); return; } args.assenza_id = f.assenza_id.value; }
    if (!args.data || !args.ora_inizio || !args.ora_fine) { avvisa('Compila giorno e orari.', 'errore'); return; }
    var m = [args.ora_inizio, args.ora_fine].some(function (o) { return (+o.split(':')[1]) % 15 !== 0; });
    if (m) { avvisa('Gli orari vanno a passi di 15 minuti (es. 16:30, 16:45).', 'errore'); return; }
    esegui(bottone, 'salvaTurno', args).then(function () { chiudiModale(); avvisa('Turno salvato', 'ok'); return ricaricaTutto(); }).catch(function (e) {
      if (/Esiste già un turno/.test(e.message)) {
        conferma(e.message + '\nVuoi salvarlo lo stesso?', 'Salva comunque').then(function (si) { if (si) { args.conferma_doppio = true; esegui(null, 'salvaTurno', args).then(function () { avvisa('Turno salvato', 'ok'); return ricaricaTutto(); }).catch(mostraErrore); } });
      } else mostraErrore(e);
    });
  }

  function registraFatto(bottone) {
    var pg = stato.boot.prossimo_giorno;

      esegui(bottone, 'salvaTurno', { data: pg.data, ora_inizio: pg.ora_inizio, ora_fine: pg.ora_fine, tipo: 'ordinario' })
        .then(function () { avvisa('Registrato: ' + fDataEstesaBreve(pg.data) + ' ' + pg.ora_inizio + '–' + pg.ora_fine, 'ok'); return ricaricaTutto(); }).catch(mostraErrore);
    };
    if (pg.data > stato.boot.oggi) conferma('Il turno di ' + fDataEstesaBreve(pg.data) + ' non è ancora passato. Registrarlo lo stesso?', 'Registra').then(function (si) { if (si) vai(); });
    else vai();
  }

      '<label>Note' + (eGenitore() && a.id ? ' (obbligatorie per le correzioni dei genitori)' : ' (facoltative)') + '</label><input type="text" name="note" value="' + esc(a.note || '') + '">' +
      '<button class="btn btn-primario" data-azione="salva-assenza">Salva</button>' +

    };

    else conferma('Eliminare questo ' + cosa.toLowerCase() + '?', 'Elimina', 'btn-rosso').then(function (si) { if (si) procedi(''); });
  }

  // ------------------------------------------------------------------ scheda SPESE
  function renderSpese() {
    var d = stato.dati; if (!d) return;
    var h = [], s = d.saldo_spese_totale, nome = nomeLav();
    h.push('<div class="carta centro"><h2>Saldo spese</h2>');
    if (s > 0) h.push('<div class="saldo pos">' + esc(nome) + ' deve ricevere ' + esc(fEuro(s)) + '</div>');

    h.push('<div class="sotto">spese sostenute da ' + esc(nome) + ' − rimborsi già pagati a parte</div></div>');
    h.push('<div class="carta"><h2>Registra</h2>');
    if (eGenitore()) {
      h.push('<button class="btn btn-primario" data-azione="nuova-spesa" data-tipo="spesa_sostenuta">' + esc(nome) + ' ha speso<span class="spiega">spesa pagata di tasca sua</span></button>');

    if (t.ore_permessi_non_retribuiti) r('Permessi non retribuiti', fOre(t.ore_permessi_non_retribuiti));
    if (t.ore_assenza_lavoratrice) r('Assenze non retribuite', fOre(t.ore_assenza_lavoratrice));

      if (d.puo_inviare) h.push('<button class="btn btn-primario btn-grande" data-azione="invia-mese">Invia ' + esc(nomeMese(d.mese)) + ' per approvazione</button>');
      else h.push('<p class="sotto">Il mese è aperto: ' + esc(nomeLav()) + ' lo invierà per approvazione dall\'ultimo giorno del mese.</p>');

      if (eGenitore()) {
        h.push('<h3>Busta paga provvisoria</h3><div class="totali"><div>Netto provvisorio</div><div class="v">' + esc(fEuro(d.busta.netto_provvisorio)) + '</div><div>Rimborsi spese</div><div class="v">' + esc(fEuro(d.busta.rimborsi_spese)) + '</div>' + (d.busta.conguaglio ? '<div>Conguaglio ' + esc(nomeMese(d.busta.conguaglio.mese)) + '</div><div class="v">' + esc(fEuro(d.busta.conguaglio.importo)) + '</div>' : '') + '<div><b>Totale da pagare</b></div><div class="v">' + esc(fEuro(d.busta.totale_da_pagare)) + '</div></div>');

        if (d.anteprima_email_studio) h.push('<details><summary>Anteprima email allo studio</summary><div class="nota-piccola"><b>A:</b> ' + esc(d.anteprima_email_studio.a) + '<br><b>Cc:</b> ' + esc((d.anteprima_email_studio.cc || []).join(', ')) + '<br><b>Oggetto:</b> ' + esc(d.anteprima_email_studio.oggetto) + (d.anteprima_email_studio.modalita_test ? '<br><span class="etichetta rosso">MODALITÀ TEST: l\'email andrà solo ai genitori</span>' : '') + '</div><div class="anteprima-email">' + esc(d.anteprima_email_studio.testo) + '</div></details>');

      } else h.push('<p class="sotto">In attesa dell\'approvazione di Manuele o Sara.</p>');

    if (d.stato === 'approvato' || d.stato === 'pagato' || d.stato === 'chiuso') {
      h.push('<p class="sotto">Approvato da ' + esc(rec.approvato_da) + ' il ' + esc(fData(rec.approvato_il)) + (rec.rettifiche > 0 ? ' (rettifica n. ' + esc(rec.rettifiche) + ')' : '') + '.</p>');
      h.push('<div class="totali"><div>Netto provvisorio</div><div class="v">' + esc(fEuro(rec.netto_provvisorio)) + '</div><div>Rimborsi spese</div><div class="v">' + esc(fEuro(rec.rimborsi_spese)) + '</div>' + (Number(rec.conguaglio_applicato) ? '<div>Conguaglio ' + esc(rec.conguaglio_mese ? nomeMese(rec.conguaglio_mese) : '') + '</div><div class="v">' + esc(fEuro(rec.conguaglio_applicato)) + '</div>' : '') + '</div>');
      h.push('<div class="saldo centro">' + (d.stato === 'approvato' ? 'Da pagare: ' : 'Pagato: ') + esc(fEuro(d.stato === 'approvato' ? rec.totale_da_pagare : rec.importo_pagato)) + '</div>');
      if (d.stato === 'approvato') h.push('<div class="sotto centro">entro il ' + esc(c.giorno_pagamento) + ' ' + esc(nomeMese(aggMesi(d.mese, 1)).split(' ')[0]) + '</div>');
      if (d.stato !== 'approvato') h.push('<div class="sotto centro">il ' + esc(fData(rec.pagato_il)) + ' · ' + esc(rec.modalita_pagamento) + '</div>');
      if (d.busta_html) h.push('<details><summary>Busta paga provvisoria</summary><div class="busta-box" id="busta-box"><iframe class="busta-frame" id="busta-frame" title="Busta paga provvisoria"></iframe></div><button class="btn btn-piccolo" data-azione="apri-busta">' + (window.ADATTATORE ? 'Scarica PDF' : 'Apri a schermo intero') + '</button></details>');
      if (eGenitore() && d.stato === 'approvato') {
        if (c.bonifico_attivo) h.push('<button class="btn btn-primario" data-azione="prepara-bonifico">Prepara bonifico</button>');

        h.push('<button class="btn btn-giallo" data-azione="riapri-mese">Riapri il mese (con nota)</button>');
      }
      if (eGenitore() && d.stato === 'pagato') h.push('<button class="btn btn-primario btn-grande" data-azione="carica-definitiva">Carica busta paga definitiva</button>');
      if (d.stato === 'chiuso') h.push('<div class="avviso verde">Busta paga definitiva caricata il ' + esc(fData(rec.definitiva_caricata_il)) + ': netto definitivo ' + esc(fEuro(rec.netto_definitivo)) + (Number(rec.differenza) ? ', differenza ' + esc(fEuro(rec.differenza)) + ' in conguaglio' + (rec.conguaglio_usato_nel_mese ? ' (applicato in ' + esc(nomeMese(rec.conguaglio_usato_nel_mese)) + ')' : ' nel prossimo mese') : ', nessuna differenza') + '.</div>');

    h.push('</div>');

    // Documenti (ricevute INPS, CU, altro)
    h.push('<div class="carta"><h2>Documenti</h2><p class="sotto">Ricevute dei versamenti INPS, Certificazione Unica e altri documenti per ' + esc(nomeLav()) + '.</p><div id="lista-documenti">' + (stato.documenti ? htmlDocumenti(stato.documenti) : '<button class="btn" data-azione="carica-documenti">Mostra i documenti</button>') + '</div>' + (eGenitore() ? '<button class="btn btn-primario" data-azione="nuovo-documento">Carica un documento</button>' : '') + '</div>');

    if (d.storico && d.storico.length) h.push('<details><summary>Storico del mese</summary>' + d.storico.map(function (s) { return '<div class="riga statica"><div class="sx"><div class="quando">' + esc(s.chi) + ' · ' + esc(etAzione(s.azione)) + '</div><div class="cosa">' + esc(s.quando) + (s.nota ? ' · «' + esc(s.nota) + '»' : '') + '</div></div></div>'; }).join('') + '</details>');
    h.push('</div>');

    var fr = $('#busta-frame'); if (fr && d.busta_html) { fr.srcdoc = d.busta_html; adattaBusta(); }
  }

  /** Adatta la busta (pagina A4 da 760 px) alla larghezza dello schermo, scalandola. */
  function adattaBusta() {
    var box = $('#busta-box'), fr = $('#busta-frame'); if (!box || !fr) return;
    var larghezza = box.clientWidth || (window.innerWidth - 56);
    var s = Math.min(1, larghezza / 760);
    fr.style.transform = 'scale(' + s + ')';
    box.style.height = Math.round(820 * s) + 'px';
  }
  window.addEventListener('resize', adattaBusta);

  function apriBustaIntera() {
    var d = stato.dati; if (!d || !d.busta_html) return;
    if (window.ADATTATORE) { window.ADATTATORE.scaricaBustaPdf(d.busta_html, 'busta-provvisoria-' + d.mese + '.pdf').then(function () { avvisa('PDF pronto', 'ok'); }).catch(mostraErrore); return; }
    var w = window.open('', '_blank');
    if (w) { w.document.open(); w.document.write(d.busta_html); w.document.close(); }
    else scarica('busta-provvisoria-' + d.mese + '.html', d.busta_html, 'text/html');
  }

  function htmlDocumenti(lista) {
    if (!lista.length) return '<p class="mut">Nessun documento ancora caricato.</p>';
    return lista.map(function (d) {
      var apri = window.ADATTATORE ? '<button class="btn btn-piccolo" data-azione="scarica-file" data-id="' + esc(d.file_id) + '" data-nome="' + esc(d.nome_file) + '">Apri</button>' : (d.url ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">Apri</a>' : '');
      return '<div class="riga statica"><div class="sx"><div class="quando">' + esc(d.etichetta_tipo) + (d.periodo ? ' ' + esc(d.periodo) : '') + (d.importo ? ' · ' + esc(fEuro(d.importo)) : '') + '</div><div class="cosa">' + esc(d.descrizione || '') + (d.descrizione ? ' · ' : '') + 'caricato da ' + esc(d.caricato_da) + ' il ' + esc(fData(d.caricato_il)) + '</div></div><div class="dx">' + apri + (d.whatsapp ? '<a class="btn btn-piccolo btn-whatsapp" href="' + esc(d.whatsapp.url) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') + (eGenitore() ? '<button class="btn btn-piccolo btn-rosso" data-azione="elimina-documento" data-id="' + esc(d.id) + '">Elimina</button>' : '') + '</div></div>';
    }).join('');
  }

  function modaleDocumento() {
    var anno = (stato.boot.oggi || '').substring(0, 4);
    var tri = Math.ceil(parseInt((stato.boot.oggi || '').substring(5, 7), 10) / 3) || 1;
    var precedente = tri === 1 ? (anno - 1) + '-T4' : anno + '-T' + (tri - 1);
    apriModale('Carica un documento', '<form id="form-documento"><label>Tipo</label><select name="tipo"><option value="inps_trimestre">Ricevuta del versamento INPS (trimestre)</option><option value="contratto">Contratto di assunzione (firmato)</option><option value="cu">Certificazione Unica</option><option value="altro">Altro documento</option></select>' +
      '<label>Trimestre o periodo</label><input type="text" name="periodo" value="' + esc(precedente) + '" placeholder="es. 2026-T4 oppure 2026"><div class="nota-piccola">Per l\'INPS usa il formato anno-trimestre: 2026-T4 = ottobre–dicembre 2026 (versamento entro il 10 gennaio).</div>' +
      '<label>Importo versato (€, facoltativo)</label><input type="text" inputmode="decimal" name="importo" placeholder="es. 48,30">' +
      '<label>Descrizione (facoltativa)</label><input type="text" name="descrizione" placeholder="es. MAV pagato il 9/1">' +
      '<label>File (PDF o foto)</label><input type="file" name="file" accept="application/pdf,image/*">' +
      '<button class="btn btn-primario" data-azione="salva-documento">Carica e avvisa ' + esc(nomeLav()) + '</button></form>');
    // il trimestre precompilato ha senso solo per la ricevuta INPS
    $('#form-documento select[name=tipo]').addEventListener('change', function () { var f = $('#form-documento'); f.periodo.value = this.value === 'inps_trimestre' ? precedente : ''; f.periodo.placeholder = this.value === 'inps_trimestre' ? 'es. 2026-T4' : 'es. 2026 (facoltativo)'; });
  }

  function salvaDocumento(bottone) {
    var f = $('#form-documento');
    var file = f.file.files[0];
    if (!file) { avvisa('Seleziona il file.', 'errore'); return; }
    if (file.size > 8 * 1024 * 1024) { avvisa('File troppo grande (massimo 8 MB).', 'errore'); return; }
    leggiBase64(file).then(function (b64) {
      return esegui(bottone, 'caricaDocumento', { tipo: f.tipo.value, periodo: f.periodo.value.trim(), importo: f.importo.value.trim(), descrizione: f.descrizione.value.trim(), nome_file: file.name, mime: file.type || '', base64: b64 });
    }).then(function (r) { chiudiModale(); avvisa('Documento caricato.', 'ok'); modaleWhatsApp('Documento caricato', 'Ora avvisa ' + nomeLav() + ' sul gruppo WhatsApp.', r.whatsapp); stato.documenti = null; return ricaricaTutto(); }).catch(mostraErrore);
  }

  function etAzione(a) { return { invia: 'invio per approvazione', chiedi_correzione: 'richiesta di correzione', approva: 'approvazione', riapri: 'riapertura', conferma_pagamento: 'pagamento confermato', carica_definitiva: 'busta definitiva caricata' }[a] || a; }

  function htmlBuste(lista) {
    if (!lista.length) return '<p class="mut">Nessuna busta paga ancora disponibile.</p>';
    return lista.map(function (b) {
      var linkProvv = !b.provvisoria ? 'Provvisoria: –' : (window.ADATTATORE ? '<button class="btn btn-piccolo" data-azione="scarica-file" data-id="' + esc(b.provvisoria.file_id) + '" data-nome="busta-provvisoria-' + esc(b.mese) + '.pdf">Provvisoria (PDF)</button>' : '<a href="' + esc(b.provvisoria.url) + '" target="_blank" rel="noopener">Provvisoria (PDF)</a>');
      var linkDef = !b.definitiva ? 'Definitiva: non ancora caricata' : (window.ADATTATORE ? '<button class="btn btn-piccolo" data-azione="scarica-file" data-id="' + esc(b.definitiva.file_id) + '" data-nome="busta-definitiva-' + esc(b.mese) + '.pdf">Definitiva (PDF)</button>' : '<a href="' + esc(b.definitiva.url) + '" target="_blank" rel="noopener">Definitiva (PDF)</a>');
      return '<div class="riga statica"><div class="sx"><div class="quando">' + esc(nomeMeseM(b.mese)) + ' <span class="etichetta ' + esc(b.stato) + '">' + esc(cp().etichette_stato[b.stato] || b.stato) + '</span></div><div class="cosa">' +
        linkProvv + ' · ' + linkDef +
        '<br>Netto provvisorio ' + esc(fEuro(b.netto_provvisorio)) + (b.importo_pagato !== '' && b.importo_pagato !== undefined ? ' · pagato ' + esc(fEuro(b.importo_pagato)) + ' il ' + esc(fData(b.pagato_il)) : '') + (b.netto_definitivo !== '' && b.netto_definitivo !== undefined ? ' · definitivo ' + esc(fEuro(b.netto_definitivo)) + ' · conguaglio ' + esc(fEuro(b.differenza)) : '') + '</div></div></div>';
    }).join('');
  }

  // ------------------------------------------------------------------ azioni del flusso
  function inviaMese(bottone, forza) {
    var d = stato.dati;
    var avvisoFine = d.mese_finito ? '' : '\nIl mese non è ancora finito: se mancano giornate future, segnale prima.';
    var pre = forza ? Promise.resolve(true) : conferma('Inviare le ore di ' + nomeMese(d.mese) + ' per approvazione?' + avvisoFine + '\nDopo l\'invio il mese non si potrà più modificare (finché un genitore non chiede una correzione).', 'Invia');
    pre.then(function (si) {
      if (!si) return;
      if (forza) chiudiModale();
      esegui(bottone, 'inviaMese', { mese: d.mese, forza_scoperte: !!forza }).then(function (r) {
        avvisa('Mese inviato.', 'ok');
        if (r && r.whatsapp) modaleWhatsApp('Mese inviato', 'Ora avvisa i genitori sul gruppo WhatsApp.', r.whatsapp);
        return ricaricaTutto();
      }).catch(function (e) {
        if (e.risposta && e.risposta.settimane_scoperte) {
          apriModale('Settimane scoperte', '<p>' + esc(e.message) + '</p>' + e.risposta.settimane_scoperte.map(function (s) { return settimanaFutura(s.giorno) ? '<div class="avviso">' + esc(fDataEstesa(s.giorno)) + ': settimana non ancora passata (' + esc(fOre(s.ore_mancanti)) + ' previste)</div>' : '<div class="avviso rosso">' + esc(fDataEstesa(s.giorno)) + ': mancano ' + esc(fOre(s.ore_mancanti)) + '</div>'; }).join('') +
            '<button class="btn btn-primario" data-azione="chiudi-modale">Ok, le completo</button>' + (eGenitore() ? '<button class="btn" data-azione="invia-mese-forzato">Invia comunque (solo genitori)</button>' : ''));
        } else mostraErrore(e);
      });
    });
  }

  function approvaMese(bottone) {
    var d = stato.dati;
    conferma('Approvare ' + nomeMese(d.mese) + ' e mandare il riepilogo allo studio?\nTotale da pagare: ' + fEuro(d.busta.totale_da_pagare) + '.\nPoi manderai la busta provvisoria a ' + nomeLav() + ' sul gruppo WhatsApp.', 'Approva e invia', 'btn-verde').then(function (si) {
      if (!si) return;

  /** Mostra il confronto provvisoria/definitiva prodotto da Claude e propone il netto. */
  function mostraAnalisiDefinitiva(an, f) {
    stato.analisiDefinitiva = an;
    if (an.netto_proposto !== null && an.netto_proposto !== undefined) f.netto.value = fNum(an.netto_proposto);
    $('#esito-lettura').textContent = an.riassunto || '';
    var h = [];
    var alti = an.problemi.filter(function (p) { return p.gravita === 'alta'; });
    if (alti.length) h.push('<div class="avviso rosso"><b>Problemi da controllare prima di caricare:</b><br>' + alti.map(function (p) { return '• ' + esc(p.testo); }).join('<br>') + '</div>');
    var altri = an.problemi.filter(function (p) { return p.gravita !== 'alta'; });
    if (altri.length) h.push('<div class="avviso">' + altri.map(function (p) { return '• ' + esc(p.testo) + ' <span class="etichetta">' + esc(p.gravita) + '</span>'; }).join('<br>') + '</div>');
    if (!an.problemi.length) h.push('<div class="avviso verde">Nessun problema segnalato da Claude.</div>');
    h.push('<table class="confronto"><thead><tr><th>Voce</th><th>Provvisoria</th><th>Definitiva</th><th>Diff.</th></tr></thead><tbody>');
    an.confronto.forEach(function (c) {
      var fmt = c.ore ? fOre : fEuro;
      var classe = c.stato === 'diverso' ? 'rosso' : (c.stato === 'arrotondamento' ? 'giallo' : (c.stato === 'uguale' ? 'verde' : ''));
      h.push('<tr class="' + classe + '"><td>' + esc(c.campo) + '</td><td>' + esc(fmt(c.provvisoria)) + '</td><td>' + (c.definitiva === null ? '–' : esc(fmt(c.definitiva))) + '</td><td>' + (c.differenza === null ? '–' : esc((c.differenza > 0 ? '+' : '') + fmt(c.differenza))) + '</td></tr>');
    });
    h.push('</tbody></table>');
    if (an.osservazioni) h.push('<p class="nota-piccola">' + esc(an.osservazioni) + '</p>');
    if (an.dati && an.dati.voci && an.dati.voci.length) h.push('<details><summary>Voci lette dalla definitiva</summary>' + an.dati.voci.map(function (v) { return '<div class="riga statica"><div class="sx">' + esc(v.descrizione || '') + (v.quantita ? ' · ' + esc(fNum(v.quantita)) + ' h' : '') + '</div><div class="dx">' + (v.importo !== null && v.importo !== undefined ? esc(fEuro(v.importo)) : '') + '</div></div>'; }).join('') + '</details>');
    $('#analisi-definitiva').innerHTML = h.join('');
  }

  function leggiBase64(file) {
    return new Promise(function (ris, rif) {
      var fr = new FileReader();
      fr.onload = function () { ris(String(fr.result).split(',')[1] || ''); };
      fr.onerror = function () { rif(new Error('Lettura del file non riuscita')); };
      fr.readAsDataURL(file);
    });
  }

      (c.whatsapp_gruppo ? '<p class="nota-piccola"><a href="' + esc(c.whatsapp_gruppo) + '" target="_blank" rel="noopener">Gruppo WhatsApp</a> (invio, correzioni, busta provvisoria, pagamento, definitiva e documenti passano da qui con «Manda sul gruppo WhatsApp»; allo studio va l\'email)</p>' : '') + '</div>');
    if (c.modalita_test && eGenitore()) h.push('<div class="carta"><h2>Dati di prova</h2><p class="sotto">Prima di partire davvero: cancella turni, assenze, spese, mesi, buste paga e documenti inseriti per provare l\'app (anche i PDF su Drive). Persone e impostazioni restano. Disponibile solo in modalità prova.</p><button class="btn btn-rosso" data-azione="azzera-dati-di-prova">Azzera tutti i dati di prova</button></div>');
    h.push('<div class="carta"><details><summary>Chiusura del rapporto</summary><p class="sotto">Calcola le ore con recupero concordato ancora da pagare (solo quelle chieste dalla famiglia) e, se vuoi, manda il conteggio allo studio.</p><label>Data di cessazione</label><input type="date" id="data-cessazione" value="' + esc(stato.boot.oggi) + '"><button class="btn" data-azione="calcola-cessazione">Calcola conteggio</button><div id="esito-cessazione"></div></details></div>');
    $('#scheda-impostazioni').innerHTML = h.join('');
  }

  function salvaImpostazioni(bottone) {
    var f = $('#form-impostazioni'), i = stato.impostazioni;
    var modifiche = { giorno_pagamento: parseInt(f.giorno_pagamento.value, 10) || 5, modalita_test: f.modalita_test.checked, bonifico: { attivo: f.bonifico_attivo.checked } };
    var lavId = bottone.dataset.lav;
    var catena = Promise.resolve();
    if (lavId) catena = catena.then(function () { return esegui(null, 'salvaUtente', { id: lavId, iban: f.iban_lav.value.replace(/\s+/g, '').toUpperCase() }); });
    else modifiche.lavoratrice = { iban: f.iban_lav.value.replace(/\s+/g, '').toUpperCase() };
    bottone.classList.add('caricamento');
    catena.then(function () { return esegui(null, 'salvaImpostazioni', { valido_dal: i.config.valido_dal, modifiche: modifiche }); })
      .then(function () { bottone.classList.remove('caricamento'); avvisa('Impostazioni salvate', 'ok'); stato.impostazioni = null; caricaImpostazioni(); return ricaricaTutto(); })
      .catch(function (e) { bottone.classList.remove('caricamento'); mostraErrore(e); });
  }


  function azzeraDatiDiProva(bottone) {
    chiediNota('Azzera i dati di prova', 'Cancella tutto quello che è stato inserito per provare (turni, assenze, spese, mesi, buste, documenti e i PDF su Drive). Non si può annullare. Scrivi CANCELLA per confermare.', true).then(function (parola) {
      if (parola === null) return;
      esegui(bottone, 'azzeraDatiDiProva', { conferma: parola }).then(function (r) {
        avvisa('Dati di prova cancellati (' + Object.keys(r.righe).reduce(function (n, k) { return n + r.righe[k]; }, 0) + ' righe, ' + r.file_cestinati + ' file su Drive).', 'ok');
        stato.buste = null; stato.documenti = null; stato.boot = null; stato.impostazioni = null;
        return avvia();
      }).catch(mostraErrore);
    });
  }

  function salvaEmail(bottone) {
    var f = $('#form-email'), i = stato.impostazioni;
    var genitori = f.genitori.value.trim();
    var extra = $$('#form-email input[name=cc_extra]:checked').map(function (x) { return x.value; });
    var cc = (f.cc_genitori.checked && genitori ? [genitori] : []).concat(extra);
    var modifiche = { email: { genitori: genitori, studio_referente: f.studio_referente.value.trim(), studio_a: f.studio_a.value.trim(), studio_cc: cc, studio_cc_lavoratrice: f.cc_lav.checked } };
    var lavId = bottone.dataset.lav, emailLav = f.email_lav.value.trim();
    var catena = Promise.resolve();
    if (lavId) catena = catena.then(function () { return esegui(null, 'salvaUtente', { id: lavId, email: emailLav }); });
    else modifiche.lavoratrice = { email: emailLav };
    bottone.classList.add('caricamento');
    catena.then(function () { return esegui(null, 'salvaImpostazioni', { valido_dal: i.config.valido_dal, modifiche: modifiche }); })
      .then(function () { bottone.classList.remove('caricamento'); avvisa('Email salvate', 'ok'); stato.impostazioni = null; caricaImpostazioni(); return ricaricaTutto(); })
      .catch(function (e) { bottone.classList.remove('caricamento'); mostraErrore(e); });
  }

  function aggiungiCc() {
    var f = $('#form-email'), v = f.nuovo_cc.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { avvisa('Scrivi un indirizzo email valido.', 'errore'); return; }
    if ($$('#form-email input[name=cc_extra]').some(function (x) { return x.value.toLowerCase() === v.toLowerCase(); })) { avvisa('Indirizzo già in elenco.', 'errore'); return; }
    var n = $$('#form-email input[name=cc_extra]').length;
    $('#cc-nuovi').insertAdjacentHTML('beforeend', '<div class="scelta"><input type="checkbox" name="cc_extra" value="' + esc(v) + '" id="cc-n' + n + '" checked><label for="cc-n' + n + '" style="margin:0">' + esc(v) + '</label></div>');
    f.nuovo_cc.value = '';
    avvisa('Aggiunto: premi «Salva email» per confermare.', 'ok');
  }


  function calcolaCessazione(bottone) {
    var data = $('#data-cessazione').value;
    esegui(bottone, 'chiudiRapporto', { data_cessazione: data, invia_email: false }).then(function (r) {
      var c = r.conteggio;
      $('#esito-cessazione').innerHTML = '<div class="avviso blu">Ore da recuperare non ancora recuperate: da pagare <b>' + esc(fOre(c.ore_da_pagare)) + '</b> (chieste dalla famiglia), non pagate <b>' + esc(fOre(c.ore_non_pagate)) + '</b> (chieste da ' + esc(nomeLav()) + ').</div><button class="btn btn-rosso" data-azione="invia-cessazione" data-data="' + esc(data) + '">Registra la cessazione e invia il conteggio allo studio</button>';
    }).catch(mostraErrore);
  }

  // ------------------------------------------------------------------ gestione eventi (delegata)
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-azione]'); if (!el) return;
    var az = el.dataset.azione, d = stato.dati;
    switch (az) {
      case 'chiudi-modale': chiudiModale(); break;
      case 'ricarica': avvia(); break;
      case 'mese-prec': caricaMese(aggMesi(stato.mese, -1)); break;
      case 'mese-succ': caricaMese(aggMesi(stato.mese, 1)); break;
      case 'vai-mese': vaiA('mese'); break;
      case 'fatto': registraFatto(el); break;
      case 'orario-diverso': modaleTurno(null, 'Orario diverso'); break;
      case 'ore-extra': modaleTurno({ tipo: 'aggiuntivo', data: stato.boot.oggi }, 'Aggiungi ore extra'); break;
      case 'nuovo-recupero': modaleTurno({ tipo: 'recupero', data: stato.boot.oggi }, 'Registra un recupero'); break;
      case 'modifica-turno': if (d && d.puo_modificare) modaleTurno(d.turni.filter(function (t) { return t.id === el.dataset.id; })[0], 'Modifica turno'); else avvisa('Il mese non è più modificabile.'); break;
      case 'salva-turno': salvaTurnoDaForm(el); break;
      case 'elimina-turno': eliminaRecord(el, 'eliminaTurno', el.dataset.id, 'Turno'); break;
      case 'non-fatto': modaleNonFatto(); break;
      case 'scelta-assenza': modaleAssenza(null, el.dataset.causa === 'altro' ? 'permesso_retribuito' : el.dataset.causa); break;
      case 'modifica-assenza': if (d && d.puo_modificare) modaleAssenza(d.assenze.filter(function (a) { return a.id === el.dataset.id; })[0]); else avvisa('Il mese non è più modificabile.'); break;
      case 'salva-assenza': salvaAssenzaDaForm(el); break;
      case 'elimina-assenza': eliminaRecord(el, 'eliminaAssenza', el.dataset.id, 'Giorno non lavorato'); break;
      case 'nuova-spesa': modaleSpesa(null, el.dataset.tipo); break;
      case 'modifica-spesa': if (d && d.puo_modificare) modaleSpesa(d.spese.voci.filter(function (s) { return s.id === el.dataset.id; })[0]); else avvisa('Il mese non è più modificabile.'); break;
      case 'salva-spesa': salvaSpesaDaForm(el); break;
      case 'elimina-spesa': eliminaRecord(el, 'eliminaSpesa', el.dataset.id, 'Spesa'); break;
      case 'invia-mese': inviaMese(el); break;
      case 'invia-mese-forzato': inviaMese(el, true); break;
      case 'accesso-genitore': ev.preventDefault(); chiudiModale(); stato.k = ''; try { localStorage.removeItem(CHIAVE_K); } catch (e2) { } mostraAccesso(''); break;
      case 'scegli-persona': scegliPersona(el.dataset.id); break;
      case 'approva-mese': approvaMese(el); break;
      case 'chiedi-correzione': chiediCorrezione(el); break;
      case 'riapri-mese': riapriMese(el); break;
      case 'conguaglio-manuale': modaleConguaglioManuale(); break;
      case 'salva-conguaglio': (function () { var f = $('#form-conguaglio'); esegui(el, 'impostaConguaglio', { mese: d.mese, importo: numero(f.importo.value), nota: f.nota.value }).then(function () { chiudiModale(); avvisa('Conguaglio salvato', 'ok'); return ricaricaTutto(); }).catch(mostraErrore); })(); break;
      case 'conferma-pagamento': modalePagamento(); break;
      case 'salva-pagamento': salvaPagamento(el); break;
      case 'prepara-bonifico': preparaBonifico(el); break;
      case 'scarica-xml': if (stato.xmlBonifico) scarica(stato.xmlBonifico.nome, stato.xmlBonifico.xml, 'application/xml'); break;
      case 'copia': copia(el.dataset.testo); break;
      case 'apri-busta': apriBustaIntera(); break;
      case 'carica-definitiva': modaleDefinitiva(); break;
      case 'salva-definitiva': salvaDefinitiva(el); break;
      case 'carica-buste': esegui(el, 'bustePaga', {}).then(function (r) { stato.buste = r.buste; $('#lista-buste').innerHTML = htmlBuste(r.buste); }).catch(mostraErrore); break;
      case 'carica-documenti': esegui(el, 'documenti', {}).then(function (r) { stato.documenti = r.documenti; $('#lista-documenti').innerHTML = htmlDocumenti(r.documenti); }).catch(mostraErrore); break;
      case 'nuovo-documento': modaleDocumento(); break;
      case 'salva-documento': salvaDocumento(el); break;
      case 'elimina-documento': conferma('Eliminare questo documento?', 'Elimina', 'btn-rosso').then(function (si) { if (si) esegui(el, 'eliminaDocumento', { id: el.dataset.id }).then(function () { avvisa('Documento eliminato', 'ok'); stato.documenti = null; return ricaricaTutto(); }).catch(mostraErrore); }); break;
      case 'scarica-file': if (window.ADATTATORE) window.ADATTATORE.scaricaFile(el.dataset.id, el.dataset.nome).then(function () { avvisa('File pronto', 'ok'); }).catch(mostraErrore); break;
      case 'posta-inviata': if (window.ADATTATORE) window.ADATTATORE.segnaInviata(el.dataset.id).then(function () { avvisa('Segnata come inviata', 'ok'); renderPosta(); }).catch(mostraErrore); break;
      case 'posta-allegato': if (window.ADATTATORE) window.ADATTATORE.scaricaFile(el.dataset.id, el.dataset.nome).then(function () { avvisa('Allegato pronto', 'ok'); }).catch(mostraErrore); break;
      case 'salva-impostazioni': salvaImpostazioni(el); break;
      case 'salva-email': salvaEmail(el); break;
      case 'aggiungi-cc': aggiungiCc(); break;
      case 'calcola-cessazione': calcolaCessazione(el); break;
      case 'azzera-dati-di-prova': azzeraDatiDiProva(el); break;
      case 'invia-cessazione': conferma('Registrare la cessazione del rapporto al ' + fData(el.dataset.data) + ' e inviare il conteggio allo studio?', 'Invia', 'btn-rosso').then(function (si) { if (si) esegui(el, 'chiudiRapporto', { data_cessazione: el.dataset.data, invia_email: true }).then(function () { avvisa('Conteggio inviato allo studio.', 'ok'); }).catch(mostraErrore); }); break;
    }
  });

  $('#modale').addEventListener('click', function (ev) { if (ev.target === this) chiudiModale(); });
  // Nessun modulo deve mai "inviarsi" da solo (ricaricherebbe la pagina): tutto passa dai pulsanti con data-azione.
  document.addEventListener('submit', function (ev) { ev.preventDefault(); });
  document.addEventListener('toggle', function (ev) { if (ev.target.querySelector && ev.target.querySelector('#busta-box')) adattaBusta(); }, true);

  window.addEventListener('ore-benedetta:dati', function () { if (stato.boot && !$('#modale').classList.contains('attivo')) ricaricaTutto(); });

  // ------------------------------------------------------------------ partenza
  stato.k = leggiCodice();
  avvia(); // senza codice l'app prova l'accesso aperto (Benedetta); se non è attivo mostra la schermata del link
})();
</script>

</body>
</html>
